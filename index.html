<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLYCERA - POS & Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#fdf4f8', 500: '#ec4899', 600: '#db2777', 900: '#831843' }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Html2Canvas & jsPDF untuk Struk / Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen selection:bg-pink-500 selection:text-white"
      x-data="glyceraApp()" x-init="initApp()"
      :style="currentBg ? `background-image: url('${currentBg}'); background-size: cover; background-position: center;` : ''">

    <!-- OVERLAY GLASSMORPHISM -->
    <div class="fixed inset-0 bg-gray-950/80 backdrop-blur-sm pointer-events-none z-0" x-show="currentBg"></div>

    <div class="relative z-10 flex h-screen overflow-hidden" x-cloak>

        <!-- ================= 1. HALAMAN LOGIN ================= -->
        <template x-if="!isLoggedIn">
            <div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-950/95 px-4">
                <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-8 space-y-6">
                    <div class="text-center space-y-2">
                        <h1 class="text-3xl font-extrabold tracking-wider text-white">GLYCERA POS</h1>
                        <p class="text-sm text-gray-400">Silakan masukkan username dan PIN Anda</p>
                    </div>

                    <form @submit.prevent="handleLogin" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Username</label>
                            <input type="text" x-model="loginForm.username" required 
                                   class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-pink-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">PIN (6 Digit)</label>
                            <input type="password" x-model="loginForm.pin" maxlength="6" required 
                                   class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-pink-500">
                        </div>
                        <template x-if="loginError">
                            <p class="text-sm text-red-400 text-center font-medium" x-text="loginError"></p>
                        </template>
                        <button type="submit" class="w-full py-3 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl shadow-lg transition duration-200">
                            MASUK SISTEM
                        </button>
                    </form>
                    
                    <!-- Supabase Connection Indicator on Login -->
                    <div class="pt-4 border-t border-gray-800 flex items-center justify-between text-xs text-gray-400">
                        <span>Database Status:</span>
                        <span class="px-2 py-1 rounded font-bold" :class="isSupabaseConnected ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'" x-text="isSupabaseConnected ? 'Connected to Supabase' : 'Local / Not Connected'"></span>
                    </div>
                </div>
            </div>
        </template>

        <!-- ================= UTAMA (SETELAH LOGIN) ================= -->
        <template x-if="isLoggedIn">
            <div class="flex h-full w-full overflow-hidden">

                <!-- BACKDROP MOBILE SIDEBAR -->
                <div class="fixed inset-0 z-40 bg-black/60 md:hidden" x-show="sidebarOpen" @click="sidebarOpen = false"></div>

                <!-- SIDEBAR NAVIGASI (URUTAN PRESISI 8 MENU) -->
                <aside class="fixed inset-y-0 left-0 z-50 w-64 bg-gray-900/95 backdrop-blur-md border-r border-gray-800 transform -translate-x-full transition-transform duration-300 ease-in-out md:translate-x-0 md:static flex flex-col"
                       :class="{'translate-x-0': sidebarOpen}">
                    
                    <div class="flex items-center justify-between h-16 px-6 border-b border-gray-800">
                        <span class="text-xl font-black tracking-widest text-pink-500">GLYCERA</span>
                        <button @click="sidebarOpen = false" class="md:hidden text-gray-400 hover:text-white">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>

                    <!-- 8 URUTAN MENU PRESISI -->
                    <nav class="flex-1 px-4 py-4 space-y-1 overflow-y-auto">
                        <template x-for="(menu, index) in navMenus" :key="index">
                            <button @click="currentTab = menu.id; sidebarOpen = false"
                                    class="w-full flex items-center px-4 py-3 text-sm font-semibold rounded-xl transition duration-150"
                                    :class="currentTab === menu.id ? 'bg-pink-600 text-white shadow-lg shadow-pink-600/30' : 'text-gray-300 hover:bg-gray-800 hover:text-white'">
                                <span class="mr-3 text-base" x-text="menu.icon"></span>
                                <span x-text="menu.name"></span>
                            </button>
                        </template>
                    </nav>

                    <!-- User Profile & Logout -->
                    <div class="p-4 border-t border-gray-800 bg-gray-900/50">
                        <div class="flex items-center justify-between mb-2">
                            <div>
                                <p class="text-xs font-bold text-white" x-text="currentUser.name"></p>
                                <p class="text-[10px] text-pink-400 uppercase tracking-wider" x-text="currentUser.role"></p>
                            </div>
                            <button @click="logout" class="p-2 text-gray-400 hover:text-red-400 transition" title="Logout">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                            </button>
                        </div>
                        <div class="text-[10px] text-gray-500 flex items-center justify-between">
                            <span>DB: <span x-text="isSupabaseConnected ? 'Supabase' : 'Local'"></span></span>
                            <button @click="syncData" class="text-pink-400 hover:underline">Sinkron</button>
                        </div>
                    </div>
                </aside>

                <!-- KONTEN UTAMA & HEADER -->
                <div class="flex flex-col flex-1 h-full overflow-hidden">
                    
                    <!-- TOPBAR MOBILE -->
                    <header class="flex items-center justify-between h-16 px-6 bg-gray-900/80 border-b border-gray-800 md:hidden">
                        <button @click="sidebarOpen = true" class="text-gray-400 hover:text-white">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                        </button>
                        <span class="font-bold text-white tracking-wider">GLYCERA PANEL</span>
                        <div class="w-6"></div>
                    </header>

                    <!-- AREA VIEW UTAMA -->
                    <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 md:p-8 bg-gray-950/60">
                        
                        <!-- 1. DASHBOARD -->
                        <div x-show="currentTab === 'dashboard'" class="space-y-6" x-cloak>
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-gray-900/90 p-6 rounded-2xl border border-gray-800">
                                <div>
                                    <h2 class="text-2xl font-black text-white">Dashboard & Laporan Keuangan</h2>
                                    <p class="text-sm text-gray-400">Ringkasan transaksi dan kalkulasi profit bersih real-time.</p>
                                </div>
                                <div class="flex flex-wrap items-center gap-3">
                                    <select x-model="dashFilterType" class="bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
                                        <option value="harian">Harian</option>
                                        <option value="bulanan">Bulanan</option>
                                        <option value="tahunan">Tahunan</option>
                                    </select>
                                    <input type="date" x-model="dashDate" class="bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
                                    <button @click="loadDashboardData()" class="px-4 py-2 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl text-sm transition">Tampilkan</button>
                                </div>
                            </div>

                            <!-- CARD STATS -->
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                <div class="bg-gray-900/90 p-5 rounded-2xl border border-gray-800">
                                    <p class="text-xs font-bold text-gray-400 uppercase">Pendapatan IDR Murni</p>
                                    <h3 class="text-xl font-black text-white mt-1" x-text="formatIDR(stats.totalIDR)"></h3>
                                </div>
                                <div class="bg-gray-900/90 p-5 rounded-2xl border border-gray-800">
                                    <p class="text-xs font-bold text-gray-400 uppercase">Pendapatan USD Murni</p>
                                    <h3 class="text-xl font-black text-white mt-1" x-text="formatUSD(stats.totalUSD)"></h3>
                                </div>
                                <div class="bg-gray-900/90 p-5 rounded-2xl border border-gray-800">
                                    <p class="text-xs font-bold text-gray-400 uppercase">Konversi Pencairan Dollar</p>
                                    <h3 class="text-xl font-black text-green-400 mt-1" x-text="formatIDR(stats.totalCairIDR)"></h3>
                                </div>
                                <div class="bg-gray-900/90 p-5 rounded-2xl border border-gray-800">
                                    <p class="text-xs font-bold text-gray-400 uppercase">Total Profit Bersih</p>
                                    <h3 class="text-xl font-black text-pink-400 mt-1" x-text="formatIDR(stats.totalProfit)"></h3>
                                </div>
                            </div>

                            <!-- RESET & PIN CONTROL -->
                            <div class="flex flex-wrap gap-3 bg-gray-900/90 p-4 rounded-2xl border border-gray-800 items-center justify-between">
                                <div class="text-sm text-gray-300">Kontrol Data Sistem & Laporan Transaksi</div>
                                <div class="flex gap-3">
                                    <button @click="openResetModal = true" class="px-4 py-2 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/30 rounded-xl text-sm font-bold transition">Reset Laporan</button>
                                    <button @click="openPinModal = true" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white rounded-xl text-sm font-bold transition">Ubah PIN Reset</button>
                                </div>
                            </div>

                            <!-- TABEL RIWAYAT TRANSAKSI -->
                            <div class="bg-gray-900/90 rounded-2xl border border-gray-800 overflow-hidden shadow-xl">
                                <div class="p-5 border-b border-gray-800 flex justify-between items-center">
                                    <h3 class="font-bold text-white">Riwayat Transaksi</h3>
                                    <button @click="exportToPDF()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm transition">Download PDF</button>
                                </div>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left border-collapse text-xs">
                                        <thead>
                                            <tr class="bg-gray-800/80 text-gray-300 uppercase font-semibold">
                                                <th class="p-3">No</th>
                                                <th class="p-3">Waktu & Faktur</th>
                                                <th class="p-3">Nama Barang (Kategori & Ukuran)</th>
                                                <th class="p-3 text-center">Qty</th>
                                                <th class="p-3">Modal / HPP</th>
                                                <th class="p-3">Harga Jual Rupiah</th>
                                                <th class="p-3">Harga Jual Dollar</th>
                                                <th class="p-3">Diskon</th>
                                                <th class="p-3">Total Bersih</th>
                                                <th class="p-3">Status Pencairan</th>
                                                <th class="p-3">TOTAL (Kotor)</th>
                                                <th class="p-3">TOTAL (Bersih)</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-gray-800 text-gray-200">
                                            <template x-for="(trx, idx) in paginatedTransactions" :key="trx.id">
                                                <tr>
                                                    <td class="p-3" x-text="startIndex + idx + 1"></td>
                                                    <td class="p-3 font-mono" x-text="trx.waktu"></td>
                                                    <td class="p-3" x-text="trx.itemDetail"></td>
                                                    <td class="p-3 text-center" x-text="trx.qty"></td>
                                                    <td class="p-3 text-pink-300" x-text="formatIDR(trx.hppTotal)"></td>
                                                    <td class="p-3" x-text="trx.currency === 'IDR' ? formatIDR(trx.hargaJual) : '-'"></td>
                                                    <td class="p-3" x-text="trx.currency === 'USD' ? formatUSD(trx.hargaJual) : '-'"></td>
                                                    <td class="p-3" x-text="trx.diskonVal"></td>
                                                    <td class="p-3 font-bold" x-text="trx.currency === 'IDR' ? formatIDR(trx.totalBersih) : formatUSD(trx.totalBersih)"></td>
                                                    <td class="p-3">
                                                        <span class="px-2 py-1 rounded text-[10px] font-bold" 
                                                            :class="trx.statusCair === 'Sudah Cair' ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'"
                                                            x-text="trx.statusCair"></span>
                                                    </td>
                                                    <td class="p-3 font-bold text-white" x-text="trx.totalKotorTampil"></td>
                                                    <td class="p-3 font-bold text-pink-400" x-text="formatIDR(trx.totalBersihProfit)"></td>
                                                </tr>
                                            </template>
                                            <template x-if="transactions.length === 0">
                                                <tr><td colspan="12" class="p-6 text-center text-gray-500">Belum ada data transaksi.</td></tr>
                                            </template>
                                        </tbody>
                                        <tfoot>
                                            <tr class="bg-gray-800/90 font-bold text-white">
                                                <td colspan="10" class="p-3 text-right">GRAND TOTAL:</td>
                                                <td class="p-3" x-text="formatIDR(grandTotalKotor)"></td>
                                                <td class="p-3 text-pink-400" x-text="formatIDR(grandTotalBersih)"></td>
                                            </tr>
                                        </tfoot>
                                    </table>
                                </div>
                                <!-- PAGINATION -->
                                <div class="p-4 border-t border-gray-800 flex justify-between items-center text-xs">
                                    <span class="text-gray-400" x-text="`Menampilkan ${transactions.length} transaksi`"></span>
                                    <div class="flex gap-2">
                                        <button @click="currentPage > 1 ? currentPage-- : null" class="px-3 py-1 bg-gray-800 rounded hover:bg-gray-700">Prev</button>
                                        <span class="px-3 py-1 bg-pink-600 rounded text-white font-bold" x-text="currentPage"></span>
                                        <button @click="currentPage < maxPage ? currentPage++ : null" class="px-3 py-1 bg-gray-800 rounded hover:bg-gray-700">Next</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 2. PENJUALAN (KASIR) -->
                        <div x-show="currentTab === 'kasir'" class="grid grid-cols-1 lg:grid-cols-3 gap-6" x-cloak>
                            <!-- KATALOG PRODUK -->
                            <div class="lg:col-span-2 space-y-4">
                                <div class="bg-gray-900/90 p-4 rounded-2xl border border-gray-800 flex flex-col sm:flex-row gap-3 items-center justify-between">
                                    <div class="flex gap-3 w-full sm:w-auto">
                                        <select x-model="posCategory" class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white w-full sm:w-48">
                                            <option value="">Semua Kategori</option>
                                            <template x-for="cat in categories" :key="cat"><option :value="cat" x-text="cat"></option></template>
                                        </select>
                                        <input type="text" x-model="posSearch" placeholder="Cari produk..." class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white w-full sm:w-64">
                                    </div>
                                    <div class="flex bg-gray-800 p-1 rounded-xl border border-gray-700">
                                        <button @click="posCurrency = 'IDR'" class="px-4 py-1.5 rounded-lg text-xs font-bold transition" :class="posCurrency === 'IDR' ? 'bg-pink-600 text-white' : 'text-gray-400'">IDR (Rp)</button>
                                        <button @click="posCurrency = 'USD'" class="px-4 py-1.5 rounded-lg text-xs font-bold transition" :class="posCurrency === 'USD' ? 'bg-pink-600 text-white' : 'text-gray-400'">USD ($)</button>
                                    </div>
                                </div>

                                <!-- GRID PRODUK -->
                                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                                    <template x-for="prod in filteredProducts" :key="prod.id">
                                        <div @click="addToCart(prod)" class="bg-gray-900/90 border border-gray-800 rounded-2xl p-4 flex flex-col justify-between hover:border-pink-500 cursor-pointer transition shadow-lg group">
                                            <div>
                                                <div class="h-28 bg-gray-800 rounded-xl mb-3 overflow-hidden flex items-center justify-center">
                                                    <template x-if="prod.foto">
                                                        <img :src="prod.foto" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                                    </template>
                                                    <template x-if="!prod.foto">
                                                        <span class="text-xs text-gray-500 font-semibold">No Image</span>
                                                    </template>
                                                </div>
                                                <h4 class="font-bold text-white text-sm line-clamp-1" x-text="prod.nama"></h4>
                                                <p class="text-[11px] text-pink-400 mt-0.5" x-text="prod.kategori + ' • ' + prod.ukuran"></p>
                                            </div>
                                            <div class="mt-4 flex items-center justify-between">
                                                <span class="text-xs font-black text-white" x-text="posCurrency === 'IDR' ? formatIDR(prod.hargaIDR) : formatUSD(prod.hargaUSD)"></span>
                                                <span class="text-[10px] bg-gray-800 px-2 py-1 rounded text-gray-300" x-text="'Stok: ' + prod.stok"></span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <!-- KERANJANG & CHECKOUT -->
                            <div class="bg-gray-900/90 border border-gray-800 rounded-2xl p-5 flex flex-col justify-between h-[calc(100vh-7rem)]">
                                <div class="space-y-4 overflow-y-auto flex-1 pr-1">
                                    <h3 class="font-bold text-white text-base border-b border-gray-800 pb-3">Keranjang Belanja (<span x-text="posCurrency"></span>)</h3>
                                    <template x-for="(item, index) in cart" :key="index">
                                        <div class="flex items-center justify-between bg-gray-800/60 p-3 rounded-xl border border-gray-700/50 gap-2">
                                            <div class="flex-1">
                                                <h5 class="font-bold text-white text-xs whitespace-normal" x-text="item.nama + ' (' + item.ukuran + ')'"></h5>
                                                <p class="text-[10px] text-pink-400 mt-0.5" x-text="posCurrency === 'IDR' ? formatIDR(item.hargaIDR) : formatUSD(item.hargaUSD)"></p>
                                            </div>
                                            <div class="flex items-center gap-2">
                                                <button @click="updateQty(index, -1)" class="w-6 h-6 bg-gray-700 rounded text-white font-bold flex items-center justify-center">-</button>
                                                <span class="text-xs font-bold w-5 text-center" x-text="item.qty"></span>
                                                <button @click="updateQty(index, 1)" class="w-6 h-6 bg-gray-700 rounded text-white font-bold flex items-center justify-center">+</button>
                                            </div>
                                        </div>
                                    </template>
                                    <template x-if="cart.length === 0">
                                        <p class="text-center text-gray-500 text-xs py-10">Keranjang kosong.</p>
                                    </template>
                                </div>

                                <div class="space-y-3 pt-4 border-t border-gray-800 mt-4">
                                    <div>
                                        <label class="block text-[11px] font-semibold text-gray-400 mb-1">Diskon Transaksi</label>
                                        <select x-model="selectedDiscountId" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white">
                                            <option value="">Tanpa Diskon</option>
                                            <template x-for="disc in discounts" :key="disc.id">
                                                <option :value="disc.id" x-text="disc.nama + ' (' + (disc.tipe === 'persen' ? disc.nilai + '%' : formatIDR(disc.nilai)) + ')'"></option>
                                            </template>
                                        </select>
                                    </div>

                                    <div class="space-y-1 text-xs">
                                        <div class="flex justify-between text-gray-400">
                                            <span>Subtotal</span>
                                            <span class="font-bold text-white" x-text="posCurrency === 'IDR' ? formatIDR(cartSubtotal) : formatUSD(cartSubtotal)"></span>
                                        </div>
                                        <div class="flex justify-between text-gray-400">
                                            <span>Potongan Diskon</span>
                                            <span class="font-bold text-pink-400" x-text="posCurrency === 'IDR' ? formatIDR(cartDiscountAmount) : formatUSD(cartDiscountAmount)"></span>
                                        </div>
                                        <div class="flex justify-between text-base font-black text-white pt-2 border-t border-gray-800">
                                            <span>Total Pembayaran</span>
                                            <span class="text-pink-500" x-text="posCurrency === 'IDR' ? formatIDR(cartTotal) : formatUSD(cartTotal)"></span>
                                        </div>
                                    </div>

                                    <button @click="checkout()" class="w-full py-3 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl shadow-lg transition duration-200 text-sm">
                                        PROSES PEMBAYARAN
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- 3. MANAJEMEN STOK (PRODUK JADI) -->
                        <div x-show="currentTab === 'stok'" class="space-y-6" x-cloak>
                            <div class="flex justify-between items-center bg-gray-900/90 p-6 rounded-2xl border border-gray-800">
                                <div>
                                    <h2 class="text-2xl font-black text-white">Manajemen Stok Produk Jadi</h2>
                                    <p class="text-sm text-gray-400">Kelola daftar parfum, harga modal, harga jual, dan stok.</p>
                                </div>
                                <button @click="openProductModal()" class="px-4 py-2 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl text-sm transition">+ Tambah Produk</button>
                            </div>

                            <div class="bg-gray-900/90 rounded-2xl border border-gray-800 overflow-hidden shadow-xl">
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left border-collapse text-xs">
                                        <thead>
                                            <tr class="bg-gray-800/80 text-gray-300 uppercase font-semibold">
                                                <th class="p-3">Foto</th>
                                                <th class="p-3">Nama Produk</th>
                                                <th class="p-3">Kategori</th>
                                                <th class="p-3">Ukuran</th>
                                                <th class="p-3">HPP (Modal)</th>
                                                <th class="p-3">Harga IDR</th>
                                                <th class="p-3">Harga USD</th>
                                                <th class="p-3 text-center">Stok</th>

    <!-- ALPINE SCRIPT -->
    <script>
        function glyceraApp() {
            return {
                isLoggedIn: false,
                sidebarOpen: false,
                currentTab: 'dashboard',
                
                loginForm: { username: '', pin: '' },
                loginError: '',
                currentUser: { name: 'Dwi Zaldy', role: 'Owner' },

                // Supabase config
                supabaseConfig: {
                    url: localStorage.getItem('supabase_url') || '',
                    key: localStorage.getItem('supabase_key') || ''
                },
                supabaseClient: null,
                isSupabaseConnected: false,

                currentBg: localStorage.getItem('glycera_bg') || '',

                navMenus: [
                    { id: 'dashboard', name: 'Dashboard', icon: '📊' },
                    { id: 'kasir', name: 'Penjualan (Kasir)', icon: '🛍️' },
                    { id: 'stok', name: 'Manajemen Stok (Produk Jadi)', icon: '📦' },
                    { id: 'bahan_baku', name: 'Manajemen Bahan Baku', icon: '🧪' },
                    { id: 'diskon', name: 'Manajemen Diskon', icon: '🏷️' },
                    { id: 'cair_dollar', name: 'Pencairan Dollar', icon: '💵' },
                    { id: 'akun', name: 'Akun & Role', icon: '👥' },
                    { id: 'pengaturan', name: 'Pengaturan', icon: '⚙️' }
                ],

                // Data Store
                dashFilterType: 'harian',
                dashDate: new Date().toISOString().split('T')[0],
                usdRate: 15500,
                resetPin: localStorage.getItem('glycera_reset_pin') || '123456',
                openResetModal: false,
                resetPinInput: '',
                openPinModal: false,
                newResetPin: '',
                openRateModal: false,

                categories: ['Extrait de Parfum', 'EDP Body Spray', 'Tester'],
                
                products: [
                    { id: 1, nama: 'Vanilla Dream', kategori: 'Extrait de Parfum', ukuran: '50ml', hpp: 45000, hargaIDR: 150000, hargaUSD: 10, stok: 25, foto: '' },
                    { id: 2, nama: 'Black Sweet', kategori: 'Extrait de Parfum', ukuran: '50ml', hpp: 48000, hargaIDR: 160000, hargaUSD: 11, stok: 20, foto: '' },
                    { id: 3, nama: 'Imperial 1910', kategori: 'Extrait de Parfum', ukuran: '100ml', hpp: 85000, hargaIDR: 300000, hargaUSD: 20, stok: 15, foto: '' },
                    { id: 4, nama: 'Java 1711', kategori: 'Extrait de Parfum', ukuran: '100ml', hpp: 90000, hargaIDR: 320000, hargaUSD: 22, stok: 12, foto: '' }
                ],

                rawMaterials: [
                    { id: 1, nama: 'Bibit Vanilla', stok: 1000, satuan: 'ml', hargaSatuan: 800 },
                    { id: 2, nama: 'Alkohol Absolute', stok: 5000, satuan: 'ml', hargaSatuan: 150 },
                    { id: 3, nama: 'Botol 50ml Spray', stok: 100, satuan: 'pcs', hargaSatuan: 4000 }
                ],

                recipes: [],
                discounts: [
                    { id: 1, nama: 'Promo Launching', tipe: 'persen', nilai: 10 },
                    { id: 2, nama: 'Potongan VIP', tipe: 'nominal', nilai: 20000 }
                ],
                selectedDiscountId: '',

                users: [
                    { id: 1, name: 'Dwi Zaldy', username: 'owner', role: 'Owner', pin: '123456' },
                    { id: 2, name: 'Kasir Glycera', username: 'kasir', role: 'Kasir', pin: '654321' }
                ],

                cart: [],
                posCategory: '',
                posSearch: '',
                posCurrency: 'IDR',

                transactions: [],
                currentPage: 1,
                itemsPerPage: 10,

                initApp() {
                    if (this.supabaseConfig.url && this.supabaseConfig.key) {
                        try {
                            this.supabaseClient = supabase.createClient(this.supabaseConfig.url, this.supabaseConfig.key);
                            this.isSupabaseConnected = true;
                            this.fetchSupabaseData();
                        } catch (e) {
                            console.error('Supabase init error:', e);
                        }
                    }
                    this.loadLocalData();
                },

                saveSupabaseConfig() {
                    localStorage.setItem('supabase_url', this.supabaseConfig.url);
                    localStorage.setItem('supabase_key', this.supabaseConfig.key);
                    if (this.supabaseConfig.url && this.supabaseConfig.key) {
                        try {
                            this.supabaseClient = supabase.createClient(this.supabaseConfig.url, this.supabaseConfig.key);
                            this.isSupabaseConnected = true;
                            alert('Berhasil terhubung ke Supabase!');
                            this.fetchSupabaseData();
                        } catch (e) {
                            alert('Gagal terhubung ke Supabase: ' + e.message);
                        }
                    } else {
                        this.isSupabaseConnected = false;
                        alert('Konfigurasi disimpan secara lokal.');
                    }
                },

                async fetchSupabaseData() {
                    if (!this.isSupabaseConnected) return;
                    try {
                        let { data: trxData } = await this.supabaseClient.from('transactions').select('*');
                        if (trxData && trxData.length > 0) {
                            this.transactions = trxData;
                        }
                    } catch (e) {
                        console.log('Supabase fetch error or table not created yet:', e);
                    }
                },

                loadLocalData() {
                    const savedTrx = localStorage.getItem('glycera_transactions');
                    if (savedTrx) {
                        this.transactions = JSON.parse(savedTrx);
                    }
                },

                saveLocalData() {
                    localStorage.setItem('glycera_transactions', JSON.stringify(this.transactions));
                },

                handleLogin() {
                    const found = this.users.find(u => u.username === this.loginForm.username && u.pin === this.loginForm.pin);
                    if (found) {
                        this.isLoggedIn = true;
                        this.currentUser = found;
                        this.loginError = '';
                    } else {
                        this.loginError = 'Username atau PIN salah!';
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                    this.loginForm = { username: '', pin: '' };
                },

                formatIDR(val) {
                    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val || 0);
                },

                formatUSD(val) {
                    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 }).format(val || 0);
                },

                get filteredProducts() {
                    return this.products.filter(p => {
                        let matchCat = this.posCategory === '' || p.kategori === this.posCategory;
                        let matchSearch = p.nama.toLowerCase().includes(this.posSearch.toLowerCase());
                        return matchCat && matchSearch;
                    });
                },

                addToCart(prod) {
                    let existing = this.cart.find(item => item.id === prod.id);
                    if (existing) {
                        if (existing.qty < prod.stok) {
                            existing.qty++;
                        }
                    } else {
                        if (prod.stok > 0) {
                            this.cart.push({ ...prod, qty: 1 });
                        }
                    }
                },

                updateQty(index, delta) {
                    this.cart[index].qty += delta;
                    if (this.cart[index].qty <= 0) {
                        this.cart.splice(index, 1);
                    }
                },

                get cartSubtotal() {
                    return this.cart.reduce((sum, item) => {
                        let price = this.posCurrency === 'IDR' ? item.hargaIDR : item.hargaUSD;
                        return sum + (price * item.qty);
                    }, 0);
                },

                get cartDiscountAmount() {
                    if (!this.selectedDiscountId) return 0;
                    let disc = this.discounts.find(d => d.id == this.selectedDiscountId);
                    if (!disc) return 0;
                    if (disc.tipe === 'persen') {
                        return (this.cartSubtotal * disc.nilai) / 100;
                    } else {
                        return Math.min(this.cartSubtotal, disc.nilai);
                    }
                },

                get cartTotal() {
                    return Math.max(0, this.cartSubtotal - this.cartDiscountAmount);
                },

                checkout() {
                    if (this.cart.length === 0) return;
                    
                    let now = new Date().toISOString().replace('T', ' ').substring(0, 19);
                    let faktur = 'INV/' + Date.now().toString().slice(-6);

                    this.cart.forEach(item => {
                        let hargaJual = this.posCurrency === 'IDR' ? item.hargaIDR : item.hargaUSD;
                        let hppTotal = item.hpp * item.qty;
                        let totalBersih = (hargaJual * item.qty) - (this.cartDiscountAmount / this.cart.length);
                        let totalKotorTampil = this.posCurrency === 'IDR' ? this.formatIDR(hargaJual * item.qty) : this.formatUSD(hargaJual * item.qty);
                        let totalBersihProfit = this.posCurrency === 'IDR' ? (totalBersih - hppTotal) : ((totalBersih * this.usdRate) - hppTotal);

                        let newTrx = {
                            id: Date.now() + Math.random(),
                            waktu: now + ' (' + faktur + ')',
                            itemDetail: `${item.nama} (${item.kategori} • ${item.ukuran})`,
                            qty: item.qty,
                            hppTotal: hppTotal,
                            hargaJual: hargaJual,
                            currency: this.posCurrency,
                            diskonVal: this.selectedDiscountId ? 'Ada' : '-',
                            totalBersih: totalBersih,
                            statusCair: this.posCurrency === 'USD' ? 'Belum Cair' : 'Sudah Cair',
                            totalKotorTampil: totalKotorTampil,
                            totalBersihProfit: totalBersihProfit
                        };

                        this.transactions.unshift(newTrx);

                        // Kurangi stok produk
                        let p = this.products.find(prod => prod.id === item.id);
                        if (p) p.stok -= item.qty;
                    });

                    this.cart = [];
                    this.selectedDiscountId = '';
                    this.saveLocalData();
                    alert('Transaksi berhasil diproses!');
                    this.currentTab = 'dashboard';
                },

                get usdTransactionsPending() {
                    return this.transactions.filter(t => t.currency === 'USD' && t.statusCair === 'Belum Cair');
                },

                cairkanDollar(id) {
                    let trx = this.transactions.find(t => t.id === id);
                    if (trx) {
                        trx.statusCair = 'Sudah Cair';
                        this.saveLocalData();
                    }
                },

                get stats() {
                    let totalIDR = 0;
                    let totalUSD = 0;
                    let totalCairIDR = 0;
                    let totalProfit = 0;

                    this.transactions.forEach(t => {
                        if (t.currency === 'IDR') {
                            totalIDR += (t.hargaJual * t.qty);
                        } else {
                            totalUSD += (t.hargaJual * t.qty);
                            if (t.statusCair === 'Sudah Cair') {
                                totalCairIDR += (t.hargaJual * t.qty) * this.usdRate;
                            }
                        }
                        totalProfit += t.totalBersihProfit;
                    });

                    return { totalIDR, totalUSD, totalCairIDR, totalProfit };
                },

                get grandTotalKotor() {
                    return this.transactions.reduce((sum, t) => {
                        let val = t.currency === 'IDR' ? (t.hargaJual * t.qty) : ((t.hargaJual * t.qty) * this.usdRate);
                        return sum + val;
                    }, 0);
                },

                get grandTotalBersih() {
                    return this.transactions.reduce((sum, t) => sum + t.totalBersihProfit, 0);
                },

                get startIndex() {
                    return (this.currentPage - 1) * this.itemsPerPage;
                },

                get paginatedTransactions() {
                    let start = this.startIndex;
                    return this.transactions.slice(start, start + this.itemsPerPage);
                },

                get maxPage() {
                    return Math.ceil(this.transactions.length / this.itemsPerPage) || 1;
                },

                executeReset() {
                    if (this.resetPinInput === this.resetPin) {
                        this.transactions = [];
                        this.saveLocalData();
                        this.openResetModal = false;
                        this.resetPinInput = '';
                        alert('Laporan berhasil direset.');
                    } else {
                        alert('PIN Reset salah!');
                    }
                },

                saveNewResetPin() {
                    if (this.newResetPin.length === 6) {
                        this.resetPin = this.newResetPin;
                        localStorage.setItem('glycera_reset_pin', this.resetPin);
                        this.openPinModal = false;
                        this.newResetPin = '';
                        alert('PIN Reset berhasil diubah.');
                    } else {
                        alert('PIN harus 6 digit.');
                    }
                },

                saveBg() {
                    localStorage.setItem('glycera_bg', this.currentBg);
                    alert('Background berhasil diterapkan.');
                },

                openProductModal() {
                    let nama = prompt('Nama Produk:');
                    if (!nama) return;
                    let kategori = prompt('Kategori (Extrait de Parfum / EDP Body Spray / Tester):', 'Extrait de Parfum');
                    let ukuran = prompt('Ukuran (contoh: 50ml):', '50ml');
                    let hpp = parseFloat(prompt('HPP / Modal (angka):', '45000')) || 0;
                    let hargaIDR = parseFloat(prompt('Harga IDR (angka):', '150000')) || 0;
                    let hargaUSD = parseFloat(prompt('Harga USD (angka):', '10')) || 0;
                    let stok = parseInt(prompt('Stok awal:', '20')) || 0;
                    let foto = prompt('URL Foto (opsional):', '');

                    this.products.push({
                        id: Date.now(),
                        nama, kategori, ukuran, hpp, hargaIDR, hargaUSD, stok, foto
                    });
                    alert('Produk berhasil ditambahkan!');
                },

                editProduct(prod) {
                    prod.nama = prompt('Edit Nama Produk:', prod.nama) || prod.nama;
                    prod.hargaIDR = parseFloat(prompt('Edit Harga IDR:', prod.hargaIDR)) || prod.hargaIDR;
                    prod.stok = parseInt(prompt('Edit Stok:', prod.stok)) || prod.stok;
                    alert('Produk diperbarui!');
                },

                deleteProduct(id) {
                    if (confirm('Hapus produk ini?')) {
                        this.products = this.products.filter(p => p.id !== id);
                    }
                },

                openMaterialModal() {
                    let nama = prompt('Nama Bahan Baku:');
                    if (!nama) return;
                    let stok = parseFloat(prompt('Jumlah Stok:', '1000')) || 0;
                    let satuan = prompt('Satuan (ml / pcs / gram):', 'ml');
                    let hargaSatuan = parseFloat(prompt('Harga per Satuan:', '150')) || 0;

                    this.rawMaterials.push({ id: Date.now(), nama, stok, satuan, hargaSatuan });
                    alert('Bahan baku ditambahkan!');
                },

                deleteMaterial(id) {
                    if (confirm('Hapus bahan baku ini?')) {
                        this.rawMaterials = this.rawMaterials.filter(m => m.id !== id);
                    }
                },

                openRecipeModal() {
                    let namaProduk = prompt('Nama Produk Hasil Racikan:', 'Custom Extrait de Parfum');
                    if (!namaProduk) return;
                    let jumlahHasil = parseInt(prompt('Jumlah Botol yang Dihasilkan:', '10')) || 1;
                    let totalModal = parseFloat(prompt('Total Modal Bahan Baku (IDR):', '450000')) || 0;
                    let komposisiDetail = prompt('Detail Komposisi (misal: Bibit 200ml + Alkohol 800ml + 10 Botol):', 'Bibit Vanilla 200ml + Alkohol 800ml');

                    this.recipes.unshift({
                        id: Date.now(),
                        namaProduk,
                        jumlahHasil,
                        totalModal,
                        komposisiDetail,
                        waktu: new Date().toLocaleString()
                    });
                    alert('Racikan berhasil dicatat!');
                },

                openDiscountModal() {
                    let nama = prompt('Nama Diskon:');
                    if (!nama) return;
                    let tipe = prompt('Tipe Diskon (persen / nominal):', 'persen');
                    let nilai = parseFloat(prompt('Nilai Diskon (angka):', '10')) || 0;

                    this.discounts.push({ id: Date.now(), nama, tipe, nilai });
                    alert('Diskon berhasil ditambahkan!');
                },

                deleteDiscount(id) {
                    if (confirm('Hapus diskon ini?')) {
                        this.discounts = this.discounts.filter(d => d.id !== id);
                    }
                },

                openUserModal() {
                    let name = prompt('Nama Lengkap:');
                    if (!name) return;
                    let username = prompt('Username:');
                    let role = prompt('Role (Owner / Kasir):', 'Kasir');
                    let pin = prompt('PIN (6 Digit):', '123456');

                    this.users.push({ id: Date.now(), name, username, role, pin });
                    alert('Akun berhasil ditambahkan!');
                },

                deleteUser(id) {
                    if (confirm('Hapus akun ini?')) {
                        this.users = this.users.filter(u => u.id !== id);
                    }
                },

                exportToPDF() {
                    const { jsPDF } = window.jspdf;
                    let doc = new jsPDF();
                    doc.text("Laporan Transaksi GLYCERA POS", 14, 20);
                    let y = 30;
                    this.transactions.slice(0, 20).forEach((t, i) => {
                        doc.text(`${i+1}. ${t.waktu} - ${t.itemDetail} (${t.currency})`, 14, y);
                        y += 10;
                    });
                    doc.save("laporan-glycera.pdf");
                }
            }
        }
    </script>
