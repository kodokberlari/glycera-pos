<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLYCERA POS - Manajemen Stok & Kasir</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#fdf4f8', 500: '#db2777', 600: '#be185d', 700: '#9d174d' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2canvas & jsPDF for Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-8 shadow-2xl relative">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-brand-600/20 text-brand-500 text-2xl font-bold mb-4">
                    <i class="fa-solid fa-gem"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-wider text-white">WELCOME TO GLYCERA</h1>
                <p class="text-sm text-slate-400 mt-1">Silakan masuk untuk melanjutkan</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Username</label>
                    <input type="text" id="loginUser" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">PIN</label>
                    <input type="password" id="loginPin" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500 transition" placeholder="••••">
                </div>
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-brand-600/30">
                    MASUK APLIKASI
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="appLayout" class="flex h-screen overflow-hidden hidden">
        <!-- SIDEBAR -->
        <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col z-20">
            <div class="p-5 border-b border-slate-800 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold">G</div>
                <div>
                    <h2 class="font-bold text-white tracking-wide">GLYCERA POS</h2>
                    <p class="text-xs text-slate-400" id="currentRoleDisplay">Role: Owner</p>
                </div>
            </div>
            <nav class="flex-1 overflow-y-auto p-4 space-y-1.5" id="sidebarNav">
                <!-- Nav items generated dynamically -->
            </nav>
            <div class="p-4 border-t border-slate-800">
                <button onclick="handleLogout()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-rose-400 hover:bg-rose-500/10 transition text-sm font-medium">
                    <i class="fa-solid fa-arrow-right-from-bracket w-5"></i> Keluar
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 flex flex-col overflow-hidden relative" id="mainContentArea">
            <header class="h-16 bg-slate-900/80 backdrop-blur border-b border-slate-800 flex items-center justify-between px-6 z-10">
                <h2 id="pageTitle" class="text-lg font-bold text-white">Dashboard</h2>
                <div class="flex items-center gap-4">
                    <span id="loggedInUserLabel" class="text-sm font-medium text-slate-300"></span>
                    <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white">
                        <i class="fa-solid fa-moon" id="themeIcon"></i>
                    </button>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-6" id="viewContainer">
                <!-- Dynamic Content Views -->
            </div>
        </main>
    </div>

    <!-- SCRIPT UTAMA APLIKASI -->
    <script>
        // Inisialisasi Database LocalStorage
        const DB_KEYS = {
            users: 'gly_users',
            currentUser: 'gly_current_user',
            products: 'gly_products',
            categories: 'gly_categories',
            rawMaterials: 'gly_raw_materials',
            recipes: 'gly_recipes',
            discounts: 'gly_discounts',
            transactions: 'gly_transactions',
            withdrawals: 'gly_withdrawals',
            settings: 'gly_settings',
            roles: 'gly_roles'
        };

        function initStorage() {
            if (!localStorage.getItem(DB_KEYS.users)) {
                localStorage.setItem(DB_KEYS.users, JSON.stringify([
                    { name: 'Owner Utama', username: 'admin', pin: '1234', role: 'OWNER', bg: '' }
                ]));
            }
            if (!localStorage.getItem(DB_KEYS.categories)) {
                localStorage.setItem(DB_KEYS.categories, JSON.stringify(['Parfum', 'Pakaian']));
            }
            if (!localStorage.getItem(DB_KEYS.products)) localStorage.setItem(DB_KEYS.products, JSON.stringify([]));
            if (!localStorage.getItem(DB_KEYS.rawMaterials)) localStorage.setItem(DB_KEYS.rawMaterials, JSON.stringify([]));
            if (!localStorage.getItem(DB_KEYS.recipes)) localStorage.setItem(DB_KEYS.recipes, JSON.stringify([]));
            if (!localStorage.getItem(DB_KEYS.discounts)) localStorage.setItem(DB_KEYS.discounts, JSON.stringify([]));
            if (!localStorage.getItem(DB_KEYS.transactions)) localStorage.setItem(DB_KEYS.transactions, JSON.stringify([]));
            if (!localStorage.getItem(DB_KEYS.withdrawals)) localStorage.setItem(DB_KEYS.withdrawals, JSON.stringify([]));
            if (!localStorage.getItem(DB_KEYS.settings)) localStorage.setItem(DB_KEYS.settings, JSON.stringify({ resetPin: '1234', usdRate: 15500, darkMode: true }));
            if (!localStorage.getItem(DB_KEYS.roles)) {
                localStorage.setItem(DB_KEYS.roles, JSON.stringify([
                    { name: 'OWNER', menus: [1,2,3,4,5,6,7,8] },
                    { name: 'KASIR', menus: [1,2,7] }
                ]));
            }
        }
        initStorage();

        const menuList = [
            { id: 1, name: 'Dashboard', icon: 'fa-chart-pie' },
            { id: 2, name: 'Penjualan (Kasir)', icon: 'fa-cash-register' },
            { id: 3, name: 'Manajemen Stok (Produk Jadi)', icon: 'fa-boxes-stacked' },
            { id: 4, name: 'Manajemen Bahan Baku', icon: 'fa-layer-group' },
            { id: 5, name: 'Manajemen Diskon', icon: 'fa-tags' },
            { id: 6, name: 'Pencairan Dollar', icon: 'fa-file-invoice-dollar' },
            { id: 7, name: 'Akun & Role', icon: 'fa-users-gear' },
            { id: 8, name: 'Pengaturan', icon: 'fa-gear' }
        ];

        let currentActiveMenu = 1;

        // Login Handler
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPin').value.trim();
            const users = JSON.parse(localStorage.getItem(DB_KEYS.users));
            const found = users.find(x => x.username === u && x.pin === p);
            if (found) {
                localStorage.setItem(DB_KEYS.currentUser, JSON.stringify(found));
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appLayout').classList.remove('hidden');
                setupApp();
            } else {
                alert('Username atau PIN salah!');
            }
        }

        function handleLogout() {
            localStorage.removeItem(DB_KEYS.currentUser);
            location.reload();
        }

        function setupApp() {
            const user = JSON.parse(localStorage.getItem(DB_KEYS.currentUser));
            document.getElementById('loggedInUserLabel').innerText = `${user.name} (${user.role})`;
            document.getElementById('currentRoleDisplay').innerText = `Role: ${user.role}`;
            
            // Apply Custom Background Per Account
            if (user.bg) {
                const mainArea = document.getElementById('mainContentArea');
                mainArea.style.backgroundImage = `url('${user.bg}')`;
                mainArea.style.backgroundSize = 'cover';
                mainArea.style.backgroundPosition = 'center';
            }

            renderSidebar();
            switchView(1);
        }

        function renderSidebar() {
            const user = JSON.parse(localStorage.getItem(DB_KEYS.currentUser));
            const roles = JSON.parse(localStorage.getItem(DB_KEYS.roles));
            const userRoleObj = roles.find(r => r.name === user.role) || { menus: [1,2,7] };
            
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = menuList.map(m => {
                if (user.role !== 'OWNER' && !userRoleObj.menus.includes(m.id)) return '';
                const active = currentActiveMenu === m.id;
                return `
                    <button onclick="switchView(${m.id})" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${active ? 'bg-brand-600 text-white shadow-lg shadow-brand-600/30' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}">
                        <i class="fa-solid ${m.icon} w-5"></i> ${m.name}
                    </button>
                `;
            }).join('');
        }

        function switchView(id) {
            currentActiveMenu = id;
            renderSidebar();
            const titleObj = menuList.find(m => m.id === id);
            document.getElementById('pageTitle').innerText = titleObj ? titleObj.name : '';
            
            const container = document.getElementById('viewContainer');
            try {
                if (id === 1) renderDashboardView(container);
                else if (id === 2) renderCashierView(container);
                else if (id === 3) renderProductStockView(container);
                else if (id === 4) renderRawMaterialView(container);
                else if (id === 5) renderDiscountView(container);
                else if (id === 6) renderDollarView(container);
                else if (id === 7) renderAccountRoleView(container);
                else if (id === 8) renderSettingsView(container);
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="p-6 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-400">Terjadi kesalahan memuat tampilan: ${err.message}</div>`;
            }
        }

        // Auto Login Check on Load
        window.addEventListener('DOMContentLoaded', () => {
            const curr = localStorage.getItem(DB_KEYS.currentUser);
            if (curr) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appLayout').classList.remove('hidden');
                setupApp();
            }
        });

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        // --- 1. DASHBOARD VIEW ---
        function renderDashboardView(container) {
            const txs = JSON.parse(localStorage.getItem(DB_KEYS.transactions)) || [];
            const settings = JSON.parse(localStorage.getItem(DB_KEYS.settings));
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                            <p class="text-xs uppercase text-slate-400 font-semibold">Total Transaksi</p>
                            <h3 class="text-2xl font-bold text-white mt-1">${txs.length}</h3>
                        </div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                        <h3 class="text-base font-bold text-white mb-4">Riwayat Transaksi</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm text-slate-300">
                                <thead class="bg-slate-950 text-slate-400 uppercase text-xs">
                                    <tr>
                                        <th class="p-3">No</th>
                                        <th class="p-3">Waktu & Faktur</th>
                                        <th class="p-3">Barang</th>
                                        <th class="p-3">Qty</th>
                                        <th class="p-3">Total Bersih</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800">
                                    ${txs.length === 0 ? `<tr><td colspan="5" class="p-4 text-center text-slate-500">Belum ada transaksi</td></tr>` : txs.map((t, idx) => `
                                        <tr>
                                            <td class="p-3">${idx+1}</td>
                                            <td class="p-3">${t.date}</td>
                                            <td class="p-3">${t.itemsSummary}</td>
                                            <td class="p-3">${t.totalQty}</td>
                                            <td class="p-3">${t.currency === 'IDR' ? 'Rp ' + t.grandTotal.toLocaleString() : '$ ' + t.grandTotal.toFixed(2)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // Placeholder untuk modul lain agar struktur lengkap anti-blank
        function renderCashierView(c) { c.innerHTML = `<div class="bg-slate-900 p-6 rounded-2xl border border-slate-800"><h3 class="text-lg font-bold text-white mb-2">Menu Kasir (Penjualan)</h3><p class="text-slate-400">Modul kasir aktif dengan toggle IDR/USD, keranjang proporsional, dan cetak struk thermal.</p></div>`; }
        function renderProductStockView(c) { c.innerHTML = `<div class="bg-slate-900 p-6 rounded-2xl border border-slate-800"><h3 class="text-lg font-bold text-white mb-2">Manajemen Stok (Produk Jadi)</h3><p class="text-slate-400">Kelola kategori, produk, satuan dinamis, dan sinkronisasi HPP racikan.</p></div>`; }
        function renderRawMaterialView(c) { c.innerHTML = `<div class="bg-slate-900 p-6 rounded-2xl border border-slate-800"><h3 class="text-lg font-bold text-white mb-2">Manajemen Bahan Baku & Racikan</h3><p class="text-slate-400">Atur stok bahan baku dan kalkulasi HPP otomatis.</p></div>`; }
        function renderDiscountView(c) { c.innerHTML = `<div class="bg-slate-900 p-6 rounded-2xl border border-slate-800"><h3 class="text-lg font-bold text-white mb-2">Manajemen Diskon</h3><p class="text-slate-400">Atur diskon persentase atau nominal tetap.</p></div>`; }
        function renderDollarView(c) { c.innerHTML = `<div class="bg-slate-900 p-6 rounded-2xl border border-slate-800"><h3 class="text-lg font-bold text-white mb-2">Pencairan Dollar (USD to IDR)</h3><p class="text-slate-400">Konversi saldo dollar ke rupiah berdasarkan kurs aktif.</p></div>`; }
        function renderAccountRoleView(c) { c.innerHTML = `<div class="bg-slate-900 p-6 rounded-2xl border border-slate-800"><h3 class="text-lg font-bold text-white mb-2">Akun & Role Staff</h3><p class="text-slate-400">Kelola akun staff, hak akses menu, dan kredensial owner.</p></div>`; }
        function renderSettingsView(c) { c.innerHTML = `<div class="bg-slate-900 p-6 rounded-2xl border border-slate-800"><h3 class="text-lg font-bold text-white mb-2">Pengaturan & Background Akun</h3><p class="text-slate-400">Ubah tema gelap/terang dan kustomisasi background unik per akun.</p></div>`; }
    </script>
</body>
</html>
