<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLYCERA POS - Sistem Kasir & Manajemen Terintegrasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#fdf4f8', 500: '#db2777', 600: '#be185d', 700: '#9d174d' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

    <div id="loginScreen" class="fixed inset-0 z-40 flex items-center justify-center bg-slate-950/90 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-8 shadow-2xl relative">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-brand-600/20 text-brand-500 text-2xl font-bold mb-4">
                    <i class="fa-solid fa-gem"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-wider text-white">GLYCERA POS</h1>
                <p class="text-sm text-slate-400 mt-1">Silakan masuk dengan akun Anda</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Username</label>
                    <input type="text" id="loginUser" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500 transition" placeholder="admin">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">PIN</label>
                    <input type="password" id="loginPin" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500 transition" placeholder="1234">
                </div>
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-brand-600/30">
                    MASUK APLIKASI
                </button>
            </form>
            <p class="text-xs text-slate-500 text-center mt-6">Default: Username: <b>admin</b> | PIN: <b>1234</b></p>
        </div>
    </div>

    <div id="appLayout" class="flex h-screen overflow-hidden hidden">
        <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col z-20">
            <div class="p-5 border-b border-slate-800 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold shadow-md">G</div>
                <div>
                    <h2 class="font-bold text-white tracking-wide">GLYCERA</h2>
                    <p class="text-xs text-slate-400" id="currentRoleDisplay">Role: OWNER</p>
                </div>
            </div>
            <nav class="flex-1 overflow-y-auto p-4 space-y-1.5" id="sidebarNav"></nav>
            <div class="p-4 border-t border-slate-800">
                <button onclick="handleLogout()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-rose-400 hover:bg-rose-500/10 transition text-sm font-medium">
                    <i class="fa-solid fa-arrow-right-from-bracket w-5"></i> Keluar
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden relative" id="mainContentArea">
            <header class="h-16 bg-slate-900/80 backdrop-blur border-b border-slate-800 flex items-center justify-between px-6 z-10">
                <h2 id="pageTitle" class="text-lg font-bold text-white">Dashboard</h2>
                <div class="flex items-center gap-4">
                    <span id="loggedInUserLabel" class="text-sm font-medium text-slate-300"></span>
                    <button onclick="document.documentElement.classList.toggle('dark')" class="w-9 h-9 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </div>
            </header>
            <div class="flex-1 overflow-y-auto p-6" id="viewContainer"></div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://mqscicebveyypntbxswe.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_-jH6NUxDK-8TOvno3oo8qw_Q_Kv6bwG';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const menuList = [
            { id: 1, name: 'Dashboard', icon: 'fa-chart-pie' },
            { id: 2, name: 'Penjualan (Kasir)', icon: 'fa-cash-register' },
            { id: 3, name: 'Manajemen Stok (Produk Jadi)', icon: 'fa-boxes-stacked' },
            { id: 4, name: 'Manajemen Bahan Baku', icon: 'fa-layer-group' },
            { id: 5, name: 'Manajemen Diskon', icon: 'fa-tags' },
            { id: 6, name: 'Pencairan Dollar', icon: 'fa-file-invoice-dollar' },
            { id: 7, name: 'Akun & Role', icon: 'fa-users-gear' },
            { id: 8, name: 'Pengaturan', icon: 'fa-gear' }
        ];

        let currentActiveMenu = 1;
        let currentUser = JSON.parse(localStorage.getItem('gly_current_user')) || null;

        window.addEventListener('DOMContentLoaded', async () => {
            if (currentUser) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appLayout').classList.remove('hidden');
                setupApp();
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPin').value.trim();
            let { data, error } = await sb.from('app_users').select('*').eq('username', u).eq('pin', p);
            if(data && data.length > 0) {
                currentUser = data[0];
                localStorage.setItem('gly_current_user', JSON.stringify(currentUser));
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appLayout').classList.remove('hidden');
                setupApp();
            } else {
                alert('Username atau PIN salah!');
            }
        }

        function handleLogout() {
            localStorage.removeItem('gly_current_user');
            location.reload();
        }

        function setupApp() {
            document.getElementById('loggedInUserLabel').innerText = `${currentUser.name} (${currentUser.role})`;
            document.getElementById('currentRoleDisplay').innerText = `Role: ${currentUser.role}`;
            renderSidebar();
            switchView(1);
        }

        function renderSidebar() {
            document.getElementById('sidebarNav').innerHTML = menuList.map(m => `
                <button onclick="switchView(${m.id})" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${currentActiveMenu === m.id ? 'bg-brand-600 text-white shadow-lg shadow-brand-600/30' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}">
                    <i class="fa-solid ${m.icon} w-5"></i> ${m.name}
                </button>
            `).join('');
        }

        async function switchView(id) {
            currentActiveMenu = id;
            renderSidebar();
            document.getElementById('pageTitle').innerText = menuList.find(m => m.id === id).name;
            const container = document.getElementById('viewContainer');
            container.innerHTML = `<div class="p-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Memuat data...</div>`;

            try {
                if (id === 1) await renderDashboard(container);
                else if (id === 2) await renderCashier(container);
                else if (id === 3) await renderProductStock(container);
                else if (id === 4) await renderRawMaterials(container);
                else if (id === 5) await renderDiscounts(container);
                else if (id === 6) await renderDollar(container);
                else if (id === 7) await renderAccounts(container);
                else if (id === 8) await renderSettings(container);
            } catch (err) {
                container.innerHTML = `<div class="p-4 bg-rose-500/10 text-rose-400 rounded-xl">Error: ${err.message}</div>`;
            }
        }

        async function renderDashboard(c) {
            let { data: txs } = await sb.from('transactions').select('*');
            let { data: prods } = await sb.from('products').select('*');
            txs = txs || []; prods = prods || [];
            c.innerHTML = `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                            <p class="text-xs uppercase text-slate-400 font-semibold">Total Produk</p>
                            <h3 class="text-3xl font-bold text-white mt-1">${prods.length}</h3>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                            <p class="text-xs uppercase text-slate-400 font-semibold">Total Transaksi</p>
                            <h3 class="text-3xl font-bold text-white mt-1">${txs.length}</h3>
                        </div>
                    </div>
                </div>
            `;
        }

        async function renderCashier(c) {
            let { data: prods } = await sb.from('products').select('*');
            prods = prods || [];
            c.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                        <h3 class="font-bold text-white mb-4">Pilih Produk</h3>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                            ${prods.length === 0 ? `<p class="text-slate-500 col-span-full">Belum ada produk. Tambahkan di menu Manajemen Stok.</p>` : prods.map(p => `
                                <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl">
                                    <h4 class="font-bold text-white text-sm">${p.name}</h4>
                                    <p class="text-xs text-slate-400 mt-1">Rp ${Number(p.price_idr).toLocaleString()}</p>
                                    <p class="text-xs text-brand-400 mt-2">Stok: ${p.stock}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                        <h3 class="font-bold text-white mb-4">Keranjang Belanja</h3>
                        <p class="text-slate-500 text-sm">Belum ada item dipilih.</p>
                    </div>
                </div>
            `;
        }

        async function renderProductStock(c) {
            let { data: products } = await sb.from('products').select('*').order('id', {ascending: false});
            products = products || [];
            c.innerHTML = `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-white">Daftar Produk Jadi</h3>
                        <button onclick="openModal('prodModal')" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition shadow-lg shadow-brand-600/30">
                            <i class="fa-solid fa-plus mr-2"></i> Tambah Produk
                        </button>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                        <table class="w-full text-left text-sm text-slate-300">
                            <thead class="bg-slate-950 text-slate-400 uppercase text-xs">
                                <tr>
                                    <th class="p-4">Nama Produk</th>
                                    <th class="p-4">Kategori</th>
                                    <th class="p-4">Ukuran</th>
                                    <th class="p-4">Harga (IDR)</th>
                                    <th class="p-4">Stok</th>
                                    <th class="p-4 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800">
                                ${products.length === 0 ? `<tr><td colspan="6" class="p-6 text-center text-slate-500">Belum ada produk.</td></tr>` : products.map(p => `
                                    <tr>
                                        <td class="p-4 font-medium text-white">${p.name}</td>
                                        <td class="p-4">${p.category || '-'}</td>
                                        <td class="p-4">${p.size || '-'}</td>
                                        <td class="p-4">Rp ${Number(p.price_idr).toLocaleString()}</td>
                                        <td class="p-4 font-bold text-brand-400">${p.stock}</td>
                                        <td class="p-4 text-center">
                                            <button onclick="deleteRow('products', ${p.id})" class="text-rose-400 hover:text-rose-300"><i class="fa-solid fa-trash"></i></button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="prodModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 p-4 hidden">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6">
                        <h3 class="font-bold text-white mb-4">Tambah Produk Baru</h3>
                        <form onsubmit="saveProduct(event)" class="space-y-4">
                            <div><label class="text-xs text-slate-300 uppercase">Nama Produk</label><input type="text" id="pName" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm mt-1"></div>
                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="text-xs text-slate-300 uppercase">Kategori</label><input type="text" id="pCat" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm mt-1"></div>
                                <div><label class="text-xs text-slate-300 uppercase">Ukuran</label><input type="text" id="pSize" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm mt-1"></div>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="text-xs text-slate-300 uppercase">Harga (IDR)</label><input type="number" id="pPrice" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm mt-1"></div>
                                <div><label class="text-xs text-slate-300 uppercase">Stok Awal</label><input type="number" id="pStock" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white text-sm mt-1"></div>
                            </div>
                            <div class="flex justify-end gap-2 mt-4">
                                <button type="button" onclick="closeModal('prodModal')" class="px-4 py-2 rounded-xl border border-slate-700 text-slate-300 text-sm">Batal</button>
                                <button type="submit" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-sm font-semibold">Simpan</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        async function saveProduct(e) {
            e.preventDefault();
            await sb.from('products').insert([{
                name: document.getElementById('pName').value,
                category: document.getElementById('pCat').value,
                size: document.getElementById('pSize').value,
                price_idr: parseFloat(document.getElementById('pPrice').value),
                stock: parseInt(document.getElementById('pStock').value)
            }]);
            closeModal('prodModal');
            switchView(3);
        }

        async function renderRawMaterials(c) {
            let { data: raw } = await sb.from('raw_materials').select('*');
            raw = raw || [];
            c.innerHTML = `<div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl"><h3 class="font-bold text-white mb-2">Manajemen Bahan Baku</h3><p class="text-slate-400 text-sm">Total bahan baku: ${raw.length} item</p></div>`;
        }
        async function renderDiscounts(c) { c.innerHTML = `<div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl"><h3 class="font-bold text-white mb-2">Manajemen Diskon</h3><p class="text-slate-400 text-sm">Modul diskon aktif.</p></div>`; }
        async function renderDollar(c) { c.innerHTML = `<div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl"><h3 class="font-bold text-white mb-2">Pencairan Dollar</h3><p class="text-slate-400 text-sm">Modul konversi USD ke IDR aktif.</p></div>`; }
        async function renderAccounts(c) {
            let { data: users } = await sb.from('app_users').select('*');
            users = users || [];
            c.innerHTML = `<div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl"><h3 class="font-bold text-white mb-2">Akun Staff</h3><p class="text-slate-400 text-sm">Total user terdaftar: ${users.length}</p></div>`;
        }
        async function renderSettings(c) { c.innerHTML = `<div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl"><h3 class="font-bold text-white mb-2">Pengaturan</h3><p class="text-slate-400 text-sm">Konfigurasi sistem.</p></div>`; }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        async function deleteRow(table, id) {
            if(confirm('Hapus data ini?')) {
                await sb.from(table).delete().eq('id', id);
                switchView(currentActiveMenu);
            }
        }
    </script>
</body>
</html>
