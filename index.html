<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLYCERA - POS & Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#fdf4f8', 500: '#ec4899', 600: '#db2777', 900: '#831843' }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Html2Canvas & jsPDF untuk Struk / Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen selection:bg-pink-500 selection:text-white"
      x-data="glyceraApp()" x-init="initApp()"
      :style="currentBg ? `background-image: url('${currentBg}'); background-size: cover; background-position: center;` : ''">

    <!-- OVERLAY GLASSMORPHISM BACKGROUND -->
    <div class="fixed inset-0 bg-gray-950/80 backdrop-blur-sm pointer-events-none z-0" x-show="currentBg"></div>

    <div class="relative z-10 flex h-screen overflow-hidden" x-cloak>

        <!-- ================= 1. HALAMAN LOGIN ================= -->
        <template x-if="!isLoggedIn">
            <div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-950/95 px-4">
                <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-8 space-y-6">
                    <div class="text-center space-y-2">
                        <h1 class="text-3xl font-extrabold tracking-wider text-white">WELCOME TO GLYCERA</h1>
                        <p class="text-sm text-gray-400">Silakan masukkan akun dan PIN Anda</p>
                    </div>

                    <form @submit.prevent="handleLogin" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Username</label>
                            <input type="text" x-model="loginForm.username" required 
                                   class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-pink-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">PIN</label>
                            <input type="password" x-model="loginForm.pin" maxlength="6" required 
                                   class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-pink-500">
                        </div>
                        <template x-if="loginError">
                            <p class="text-sm text-red-400 text-center font-medium" x-text="loginError"></p>
                        </template>
                        <button type="submit" class="w-full py-3 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl shadow-lg transition duration-200">
                            MASUK SISTEM
                        </button>
                    </form>
                </div>
            </div>
        </template>

        <!-- ================= UTAMA (SETELAH LOGIN) ================= -->
        <template x-if="isLoggedIn">
            <div class="flex h-full w-full overflow-hidden">

                <!-- BACKDROP MOBILE SIDEBAR -->
                <div class="fixed inset-0 z-40 bg-black/60 md:hidden" x-show="sidebarOpen" @click="sidebarOpen = false"></div>

                <!-- SIDEBAR NAVIGASI (URUTAN PRESISI SESUAI PERMINTAAN) -->
                <aside class="fixed inset-y-0 left-0 z-50 w-64 bg-gray-900/95 backdrop-blur-md border-r border-gray-800 transform -translate-x-full transition-transform duration-300 ease-in-out md:translate-x-0 md:static flex flex-col"
                       :class="{'translate-x-0': sidebarOpen}">
                    
                    <div class="flex items-center justify-between h-16 px-6 border-b border-gray-800">
                        <span class="text-xl font-black tracking-widest text-pink-500">GLYCERA</span>
                        <button @click="sidebarOpen = false" class="md:hidden text-gray-400 hover:text-white">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>

                    <!-- 8 URUTAN MENU PRESISI -->
                    <nav class="flex-1 px-4 py-4 space-y-1 overflow-y-auto">
                        <template x-for="(menu, index) in navMenus" :key="index">
                            <button @click="currentTab = menu.id; sidebarOpen = false"
                                    class="w-full flex items-center px-4 py-3 text-sm font-semibold rounded-xl transition duration-150"
                                    :class="currentTab === menu.id ? 'bg-pink-600 text-white shadow-lg shadow-pink-600/30' : 'text-gray-300 hover:bg-gray-800 hover:text-white'">
                                <span class="mr-3 text-base" x-text="menu.icon"></span>
                                <span x-text="menu.name"></span>
                            </button>
                        </template>
                    </nav>

                    <!-- User Profile & Logout -->
                    <div class="p-4 border-t border-gray-800 bg-gray-900/50">
                        <div class="flex items-center justify-between mb-3">
                            <div>
                                <p class="text-xs font-bold text-white" x-text="currentUser.name"></p>
                                <p class="text-[10px] text-pink-400 uppercase tracking-wider" x-text="currentUser.role"></p>
                            </div>
                            <button @click="logout" class="p-2 text-gray-400 hover:text-red-400 transition" title="Logout">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                            </button>
                        </div>
                    </div>
                </aside>

                <!-- KONTEN UTAMA & HEADER -->
                <div class="flex flex-col flex-1 h-full overflow-hidden">
                    
                    <!-- TOPBAR MOBILE -->
                    <header class="flex items-center justify-between h-16 px-6 bg-gray-900/80 border-b border-gray-800 md:hidden">
                        <button @click="sidebarOpen = true" class="text-gray-400 hover:text-white">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                        </button>
                        <span class="font-bold text-white tracking-wider">GLYCERA PANEL</span>
                        <div class="w-6"></div>
                    </header>

                    <!-- AREA VIEW UTAMA -->
                    <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 md:p-8 bg-gray-950/60">
                        
                        <!-- 1. DASHBOARD -->
                        <div x-show="currentTab === 'dashboard'" class="space-y-6" x-cloak>
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-gray-900/90 p-6 rounded-2xl border border-gray-800">
                                <div>
                                    <h2 class="text-2xl font-black text-white">Dashboard & Laporan Keuangan</h2>
                                    <p class="text-sm text-gray-400">Ringkasan transaksi dan kalkulasi profit bersih real-time.</p>
                                </div>
                                <div class="flex flex-wrap items-center gap-3">
                                    <select x-model="dashFilterType" class="bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
                                        <option value="harian">Harian</option>
                                        <option value="bulanan">Bulanan</option>
                                        <option value="tahunan">Tahunan</option>
                                    </select>
                                    <input type="date" x-model="dashDate" class="bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
                                    <button @click="loadDashboardData()" class="px-4 py-2 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl text-sm transition">Tampilkan</button>
                                </div>
                            </div>

                            <!-- CARD STATS -->
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                <div class="bg-gray-900/90 p-5 rounded-2xl border border-gray-800">
                                    <p class="text-xs font-bold text-gray-400 uppercase">Pendapatan IDR Murni</p>
                                    <h3 class="text-xl font-black text-white mt-1" x-text="formatIDR(stats.totalIDR)"></h3>
                                </div>
                                <div class="bg-gray-900/90 p-5 rounded-2xl border border-gray-800">
                                    <p class="text-xs font-bold text-gray-400 uppercase">Pendapatan USD Murni</p>
                                    <h3 class="text-xl font-black text-white mt-1" x-text="formatUSD(stats.totalUSD)"></h3>
                                </div>
                                <div class="bg-gray-900/90 p-5 rounded-2xl border border-gray-800">
                                    <p class="text-xs font-bold text-gray-400 uppercase">Konversi Pencairan Dollar</p>
                                    <h3 class="text-xl font-black text-green-400 mt-1" x-text="formatIDR(stats.totalCairIDR)"></h3>
                                </div>
                                <div class="bg-gray-900/90 p-5 rounded-2xl border border-gray-800">
                                    <p class="text-xs font-bold text-gray-400 uppercase">Total Profit Bersih</p>
                                    <h3 class="text-xl font-black text-pink-400 mt-1" x-text="formatIDR(stats.totalProfit)"></h3>
                                </div>
                            </div>

                            <!-- RESET & PIN CONTROL -->
                            <div class="flex flex-wrap gap-3 bg-gray-900/90 p-4 rounded-2xl border border-gray-800 items-center justify-between">
                                <div class="text-sm text-gray-300">Kontrol Data Sistem & Laporan Transaksi</div>
                                <div class="flex gap-3">
                                    <button @click="openResetModal = true" class="px-4 py-2 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/30 rounded-xl text-sm font-bold transition">Reset Laporan</button>
                                    <button @click="openPinModal = true" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white rounded-xl text-sm font-bold transition">Ubah PIN Reset</button>
                                </div>
                            </div>

                            <!-- TABEL RIWAYAT TRANSAKSI -->
                            <div class="bg-gray-900/90 rounded-2xl border border-gray-800 overflow-hidden shadow-xl">
                                <div class="p-5 border-b border-gray-800 flex justify-between items-center">
                                    <h3 class="font-bold text-white">Riwayat Transaksi</h3>
                                    <button @click="exportToPDF()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm transition">Download PDF</button>
                                </div>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left border-collapse text-xs">
                                        <thead>
                                            <tr class="bg-gray-800/80 text-gray-300 uppercase font-semibold">
                                                <th class="p-3">No</th>
                                                <th class="p-3">Waktu & Faktur</th>
                                                <th class="p-3">Nama Barang</th>
                                                <th class="p-3 text-center">Qty</th>
                                                <th class="p-3">Modal / HPP</th>
                                                <th class="p-3">Harga Rupiah</th>
                                                <th class="p-3">Harga Dollar</th>
                                                <th class="p-3">Diskon</th>
                                                <th class="p-3">Total Bersih</th>
                                                <th class="p-3">Status Pencairan</th>
                                                <th class="p-3">TOTAL (Kotor)</th>
                                                <th class="p-3">TOTAL (Bersih)</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-gray-800 text-gray-200">
                                            <template x-for="(trx, idx) in paginatedTransactions" :key="trx.id">
                                                <tr>
                                                    <td class="p-3" x-text="startIndex + idx + 1"></td>
                                                    <td class="p-3 font-mono" x-text="trx.waktu"></td>
                                                    <td class="p-3" x-text="trx.itemDetail"></td>
                                                    <td class="p-3 text-center" x-text="trx.qty"></td>
                                                    <td class="p-3 text-pink-300" x-text="formatIDR(trx.hppTotal)"></td>
                                                    <td class="p-3" x-text="trx.currency === 'IDR' ? formatIDR(trx.hargaJual) : '-'"></td>
                                                    <td class="p-3" x-text="trx.currency === 'USD' ? formatUSD(trx.hargaJual) : '-'"></td>
                                                    <td class="p-3" x-text="trx.diskonVal"></td>
                                                    <td class="p-3 font-bold" x-text="trx.currency === 'IDR' ? formatIDR(trx.totalBersih) : formatUSD(trx.totalBersih)"></td>
                                                    <td class="p-3">
                                                        <span class="px-2 py-1 rounded text-[10px] font-bold" 
                                                              :class="trx.statusCair === 'Sudah Cair' ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'"
                                                              x-text="trx.statusCair"></span>
                                                    </td>
                                                    <td class="p-3 font-bold text-white" x-text="trx.totalKotorTampil"></td>
                                                    <td class="p-3 font-bold text-pink-400" x-text="formatIDR(trx.totalBersihProfit)"></td>
                                                </tr>
                                            </template>
                                            <template x-if="transactions.length === 0">
                                                <tr><td colspan="12" class="p-6 text-center text-gray-500">Belum ada data transaksi.</td></tr>
                                            </template>
                                        </tbody>
                                        <tfoot>
                                            <tr class="bg-gray-800/90 font-bold text-white">
                                                <td colspan="10" class="p-3 text-right">GRAND TOTAL:</td>
                                                <td class="p-3" x-text="formatIDR(grandTotalKotor)"></td>
                                                <td class="p-3 text-pink-400" x-text="formatIDR(grandTotalBersih)"></td>
                                            </tr>
                                        </tfoot>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- 2. PENJUALAN (KASIR) -->
                        <div x-show="currentTab === 'kasir'" class="grid grid-cols-1 lg:grid-cols-3 gap-6" x-cloak>
                            <div class="lg:col-span-2 space-y-4">
                                <div class="bg-gray-900/90 p-4 rounded-2xl border border-gray-800 flex flex-col sm:flex-row gap-3 items-center justify-between">
                                    <div class="flex gap-3 w-full sm:w-auto">
                                        <select x-model="posCategory" class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white w-full sm:w-48">
                                            <option value="">Semua Kategori</option>
                                            <template x-for="cat in categories" :key="cat"><option :value="cat" x-text="cat"></option></template>
                                        </select>
                                        <input type="text" x-model="posSearch" placeholder="Cari produk..." class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white w-full sm:w-64">
                                    </div>
                                    <div class="flex bg-gray-800 p-1 rounded-xl border border-gray-700">
                                        <button @click="posCurrency = 'IDR'" class="px-4 py-1.5 rounded-lg text-xs font-bold transition" :class="posCurrency === 'IDR' ? 'bg-pink-600 text-white' : 'text-gray-400'">IDR (Rp)</button>
                                        <button @click="posCurrency = 'USD'" class="px-4 py-1.5 rounded-lg text-xs font-bold transition" :class="posCurrency === 'USD' ? 'bg-pink-600 text-white' : 'text-gray-400'">USD ($)</button>
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                                    <template x-for="prod in filteredProducts" :key="prod.id">
                                        <div @click="addToCart(prod)" class="bg-gray-900/90 border border-gray-800 rounded-2xl p-4 flex flex-col justify-between hover:border-pink-500 cursor-pointer transition shadow-lg group">
                                            <div>
                                                <div class="h-28 bg-gray-800 rounded-xl mb-3 overflow-hidden flex items-center justify-center">
                                                    <template x-if="prod.foto"><img :src="prod.foto" class="w-full h-full object-cover group-hover:scale-105 transition duration-300"></template>
                                                    <template x-if="!prod.foto"><span class="text-xs text-gray-500 font-semibold">No Image</span></template>
                                                </div>
                                                <h4 class="font-bold text-white text-sm line-clamp-1" x-text="prod.nama"></h4>
                                                <p class="text-[11px] text-pink-400 mt-0.5" x-text="prod.kategori + ' • ' + prod.ukuran"></p>
                                            </div>
                                            <div class="mt-4 flex items-center justify-between">
                                                <span class="text-xs font-black text-white" x-text="posCurrency === 'IDR' ? formatIDR(prod.hargaIDR) : formatUSD(prod.hargaUSD)"></span>
                                                <span class="text-[10px] bg-gray-800 px-2 py-1 rounded text-gray-300" x-text="'Stok: ' + prod.stok"></span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>

                            <div class="bg-gray-900/90 border border-gray-800 rounded-2xl p-5 flex flex-col justify-between h-[calc(100vh-7rem)]">
                                <div class="space-y-4 overflow-y-auto flex-1 pr-1">
                                    <h3 class="font-bold text-white text-base border-b border-gray-800 pb-3">Keranjang (<span x-text="posCurrency"></span>)</h3>
                                    <template x-for="(item, index) in cart" :key="index">
                                        <div class="flex items-center justify-between bg-gray-800/60 p-3 rounded-xl border border-gray-700/50 gap-2">
                                            <div class="flex-1">
                                                <h5 class="font-bold text-white text-xs" x-text="item.nama + ' (' + item.ukuran + ')'"></h5>
                                                <p class="text-[10px] text-pink-400 mt-0.5" x-text="posCurrency === 'IDR' ? formatIDR(item.hargaIDR) : formatUSD(item.hargaUSD)"></p>
                                            </div>
                                            <div class="flex items-center gap-2">
                                                <button @click="updateQty(index, -1)" class="w-6 h-6 bg-gray-700 rounded text-white font-bold flex items-center justify-center">-</button>
                                                <span class="text-xs font-bold w-5 text-center" x-text="item.qty"></span>
                                                <button @click="updateQty(index, 1)" class="w-6 h-6 bg-gray-700 rounded text-white font-bold flex items-center justify-center">+</button>
                                            </div>
                                        </div>
                                    </template>
                                    <template x-if="cart.length === 0">
                                        <p class="text-center text-gray-500 text-xs py-10">Keranjang kosong.</p>
                                    </template>
                                </div>

                                <div class="space-y-3 pt-4 border-t border-gray-800 mt-4">
                                    <div>
                                        <label class="block text-[11px] font-semibold text-gray-400 mb-1">Diskon Transaksi</label>
                                        <select x-model="selectedDiscountId" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white">
                                            <option value="">Tanpa Diskon</option>
                                            <template x-for="disc in discounts" :key="disc.id">
                                                <option :value="disc.id" x-text="disc.nama + ' (' + (disc.tipe === 'persen' ? disc.nilai + '%' : formatIDR(disc.nilai)) + ')'"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div class="space-y-1 text-xs">
                                        <div class="flex justify-between text-gray-400">
                                            <span>Subtotal</span>
                                            <span x-text="posCurrency === 'IDR' ? formatIDR(cartSubtotal) : formatUSD(cartSubtotal)"></span>
                                        </div>
                                        <div class="flex justify-between text-gray-400">
                                            <span>Potongan Diskon</span>
                                            <span x-text="posCurrency === 'IDR' ? formatIDR(cartDiscountAmount) : formatUSD(cartDiscountAmount)"></span>
                                        </div>
                                        <div class="flex justify-between text-base font-black text-white pt-2 border-t border-gray-800">
                                            <span>Total Akhir</span>
                                            <span class="text-pink-400" x-text="posCurrency === 'IDR' ? formatIDR(cartFinalTotal) : formatUSD(cartFinalTotal)"></span>
                                        </div>
                                    </div>
                                    <button @click="processCheckout" :disabled="cart.length === 0" 
                                            class="w-full py-3 bg-pink-600 hover:bg-pink-500 disabled:opacity-50 text-white font-bold rounded-xl text-sm transition shadow-lg shadow-pink-600/30">
                                        BAYAR & CETAK STRUK
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- 3. MANAJEMEN STOK (PRODUK JADI) -->
                        <div x-show="currentTab === 'stok-produk'" class="space-y-6" x-cloak>
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-gray-900/90 p-6 rounded-2xl border border-gray-800">
                                <div>
                                    <h2 class="text-2xl font-black text-white">Manajemen Stok Produk Jadi</h2>
                                    <p class="text-sm text-gray-400">Atur produk, kategori, dan resep racikan otomatis.</p>
                                </div>
                                <div class="flex gap-3">
                                    <button @click="openCategoryModal = true" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white font-bold rounded-xl text-sm transition">Kelola Kategori</button>
                                    <button @click="openProductModal()" class="px-4 py-2 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl text-sm transition">+ Tambah Produk</button>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                <template x-for="prod in products" :key="prod.id">
                                    <div class="bg-gray-900/90 border border-gray-800 rounded-2xl p-5 flex flex-col justify-between shadow-lg">
                                        <div>
                                            <div class="h-32 bg-gray-800 rounded-xl mb-3 overflow-hidden flex items-center justify-center">
                                                <template x-if="prod.foto"><img :src="prod.foto" class="w-full h-full object-cover"></template>
                                                <template x-if="!prod.foto"><span class="text-xs text-gray-500">No Image</span></template>
                                            </div>
                                            <h4 class="font-bold text-white text-base" x-text="prod.nama"></h4>
                                            <p class="text-xs text-pink-400 mt-1" x-text="prod.kategori + ' • ' + prod.ukuran"></p>
                                            <p class="text-xs text-gray-400 mt-2">HPP Modal: <span class="text-white font-bold" x-text="formatIDR(prod.hpp)"></span></p>
                                            <p class="text-xs text-gray-400">Jual IDR: <span class="text-white font-bold" x-text="formatIDR(prod.hargaIDR)"></span></p>
                                            <p class="text-xs text-gray-400">Stok: <span class="text-white font-bold" x-text="prod.stok"></span></p>
                                        </div>
                                        <div class="mt-4 flex gap-2 pt-3 border-t border-gray-800">
                                            <button @click="editProduct(prod)" class="flex-1 py-1.5 bg-gray-800 hover:bg-gray-700 text-white rounded-lg text-xs font-bold">Edit</button>
                                            <button @click="deleteProduct(prod.id)" class="py-1.5 px-3 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white rounded-lg text-xs font-bold transition">Hapus</button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- 4. MANAJEMEN BAHAN BAKU & RACIKAN -->
                        <div x-show="currentTab === 'bahan-baku'" class="space-y-6" x-cloak>
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-gray-900/90 p-6 rounded-2xl border border-gray-800">
                                <div>
                                    <h2 class="text-2xl font-black text-white">Manajemen Bahan Baku & Racikan</h2>
                                    <p class="text-sm text-gray-400">Kelola stok bahan mentah dan formula resep produk.</p>
                                </div>
                                <button @click="openIngredientModal()" class="px-4 py-2 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl text-sm transition">+ Tambah Bahan Baku</button>
                            </div>

                            <div class="bg-gray-900/90 rounded-2xl border border-gray-800 overflow-hidden shadow-xl">
                                <table class="w-full text-left border-collapse text-xs">
                                    <thead>
                                        <tr class="bg-gray-800/80 text-gray-300 uppercase font-semibold">
                                            <th class="p-3">No</th>
                                            <th class="p-3">Nama Bahan Baku</th>
                                            <th class="p-3">Stok Tersedia</th>
                                            <th class="p-3">Satuan</th>
                                            <th class="p-3">Harga Beli / Satuan</th>
                                            <th class="p-3 text-center">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-800 text-gray-200">
                                        <template x-for="(ing, idx) in ingredients" :key="ing.id">
                                            <tr>
                                                <td class="p-3" x-text="idx + 1"></td>
                                                <td class="p-3 font-bold text-white" x-text="ing.nama"></td>
                                                <td class="p-3" x-text="ing.stok"></td>
                                                <td class="p-3" x-text="ing.satuan"></td>
                                                <td class="p-3" x-text="formatIDR(ing.hargaSatuan)"></td>
                                                <td class="p-3 text-center space-x-2">
                                                    <button @click="editIngredient(ing)" class="text-pink-400 hover:underline">Edit</button>
                                                    <button @click="deleteIngredient(ing.id)" class="text-red-400 hover:underline">Hapus</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- 5. MANAJEMEN DISKON -->
                        <div x-show="currentTab === 'diskon'" class="space-y-6" x-cloak>
                            <div class="flex justify-between items-center bg-gray-900/90 p-6 rounded-2xl border border-gray-800">
                                <div>
                                    <h2 class="text-2xl font-black text-white">Manajemen Diskon</h2>
                                    <p class="text-sm text-gray-400">Atur potongan harga persentase atau nominal tetap.</p>
                                </div>
                                <button @click="openDiscountModal()" class="px-4 py-2 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl text-sm transition">+ Buat Diskon</button>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <template x-for="disc in discounts" :key="disc.id">
                                    <div class="bg-gray-900/90 p-5 rounded-2xl border border-gray-800 flex flex-col justify-between">
                                        <div>
                                            <h3 class="font-bold text-white text-base" x-text="disc.nama"></h3>
                                            <p class="text-xl font-black text-pink-400 mt-2" x-text="disc.tipe === 'persen' ? disc.nilai + '%' : formatIDR(disc.nilai)"></p>
                                        </div>
                                        <div class="mt-4 flex gap-2 pt-3 border-t border-gray-800">
                                            <button @click="deleteDiscount(disc.id)" class="w-full py-1.5 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white rounded-lg text-xs font-bold transition">Hapus Diskon</button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- 6. PENCAIRAN DOLLAR -->
                        <div x-show="currentTab === 'pencairan'" class="space-y-6" x-cloak>
                            <div class="flex justify-between items-center bg-gray-900/90 p-6 rounded-2xl border border-gray-800">
                                <div>
                                    <h2 class="text-2xl font-black text-white">Pencairan Dollar (USD)</h2>
                                    <p class="text-sm text-gray-400">Konversikan saldo pendapatan USD ke Rupiah ke dalam kasir.</p>
                                </div>
                            </div>
                            <div class="bg-gray-900/90 p-6 rounded-2xl border border-gray-800 space-y-4 max-w-lg">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-400 mb-1">Jumlah USD yang Dicairkan</label>
                                    <input type="number" x-model="cairForm.amountUSD" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-white text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-400 mb-1">Kurs Konversi (1 USD ke IDR)</label>
                                    <input type="number" x-model="cairForm.kurs" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-white text-sm">
                                </div>
                                <button @click="processCairUSD" class="w-full py-3 bg-green-600 hover:bg-green-500 text-white font-bold rounded-xl text-sm transition">Cairkan Sekarang</button>
                            </div>
                        </div>

                        <!-- 7. AKUN & ROLE -->
                        <div x-show="currentTab === 'akun'" class="space-y-6" x-cloak>
                            <div class="flex justify-between items-center bg-gray-900/90 p-6 rounded-2xl border border-gray-800">
                                <div>
                                    <h2 class="text-2xl font-black text-white">Manajemen Akun & Role</h2>
                                    <p class="text-sm text-gray-400">Kelola pengguna kasir, admin, dan hak akses.</p>
                                </div>
                            </div>
                            <div class="bg-gray-900/90 rounded-2xl border border-gray-800 overflow-hidden shadow-xl">
                                <table class="w-full text-left border-collapse text-xs">
                                    <thead>
                                        <tr class="bg-gray-800/80 text-gray-300 uppercase font-semibold">
                                            <th class="p-3">Nama Pengguna</th>
                                            <th class="p-3">Username</th>
                                            <th class="p-3">Role</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-800 text-gray-200">
                                        <template x-for="usr in usersList" :key="usr.id">
                                            <tr>
                                                <td class="p-3 font-bold text-white" x-text="usr.name"></td>
                                                <td class="p-3" x-text="usr.username"></td>
                                                <td class="p-3 text-pink-400 font-bold uppercase" x-text="usr.role"></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- 8. PENGATURAN -->
                        <div x-show="currentTab === 'pengaturan'" class="space-y-6" x-cloak>
                            <div class="bg-gray-900/90 p-6 rounded-2xl border border-gray-800">
                                <h2 class="text-2xl font-black text-white mb-2">Pengaturan Sistem</h2>
                                <p class="text-sm text-gray-400 mb-6">Kustomisasi tampilan latar belakang panel.</p>
                                <div class="space-y-4 max-w-md">
                                    <div>
                                        <label class="block text-xs font-semibold text-gray-400 mb-1">URL Gambar Background Custom</label>
                                        <input type="text" x-model="currentBg" placeholder="https://example.com/image.jpg" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-white text-sm">
                                    </div>
                                    <button @click="currentBg = ''" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white rounded-xl text-xs font-bold">Hapus Background</button>
                                </div>
                            </div>
                        </div>

                    </main>
                </div>
            </div>
        </template>
    </div>

    <!-- ALPINE JS APP LOGIC -->
    <script>
        function glyceraApp() {
            return {
                isLoggedIn: true, // Ubah ke false jika ingin wajib login awal
                sidebarOpen: false,
                currentTab: 'dashboard',
                currentUser: { name: 'Dwi Zaldy', role: 'Administrator' },
                loginForm: { username: '', pin: '' },
                loginError: '',
                currentBg: '',
                
                // Urutan Presisi Sidebar Sesuai Arahan Anda
                navMenus: [
                    { id: 'dashboard', name: 'Dashboard', icon: '📊' },
                    { id: 'kasir', name: 'Penjualan (Kasir)', icon: '🛒' },
                    { id: 'stok-produk', name: 'Manajemen Stok (Produk Jadi)', icon: '📦' },
                    { id: 'bahan-baku', name: 'Manajemen Bahan Baku', icon: '🧪' },
                    { id: 'diskon', name: 'Manajemen Diskon', icon: '🏷️' },
                    { id: 'pencairan', name: 'Pencairan Dollar', icon: '💵' },
                    { id: 'akun', name: 'Akun & Role', icon: '👤' },
                    { id: 'pengaturan', name: 'Pengaturan', icon: '⚙️' }
                ],

                // Dummy Data State
                dashFilterType: 'harian',
                dashDate: new Date().toISOString().split('T')[0],
                stats: { totalIDR: 1500000, totalUSD: 45, totalCairIDR: 700000, totalProfit: 850000 },
                
                categories: ['Extrait de Parfum', 'Body Mist', 'Aksesoris'],
                productFilterCategory: '',
                posCategory: '',
                posSearch: '',
                posCurrency: 'IDR',

                products: [
                    { id: 1, nama: 'Vanilla Dream', kategori: 'Extrait de Parfum', ukuran: '30ml', hpp: 45000, hargaIDR: 95000, hargaUSD: 10, stok: 25, foto: '' },
                    { id: 2, nama: 'Imperial 1910', kategori: 'Extrait de Parfum', ukuran: '50ml', hpp: 75000, hargaIDR: 160000, hargaUSD: 18, stok: 15, foto: '' },
                    { id: 3, nama: 'Java 1711', kategori: 'Extrait de Parfum', ukuran: '30ml', hpp: 50000, hargaIDR: 110000, hargaUSD: 12, stok: 30, foto: '' }
                ],

                cart: [],
                selectedDiscountId: '',
                discounts: [
                    { id: 1, nama: 'Promo Launching', tipe: 'persen', nilai: 10 }
                ],

                ingredients: [
                    { id: 1, nama: 'Bibit Vanilla', stok: 500, satuan: 'ml', hargaSatuan: 1500 },
                    { id: 2, nama: 'Alcohol Absolute', stok: 2000, satuan: 'ml', hargaSatuan: 300 }
                ],

                usersList: [
                    { id: 1, name: 'Dwi Zaldy', username: 'dwizaldy', role: 'Administrator' }
                ],

                transactions: [],
                currentPage: 1,
                itemsPerPage: 10,

                initApp() {
                    // Inisialisasi awal sistem
                },

                handleLogin() {
                    if(this.loginForm.username && this.loginForm.pin) {
                        this.isLoggedIn = true;
                    } else {
                        this.loginError = 'Masukkan Username dan PIN yang valid.';
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                },

                formatIDR(val) {
                    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val || 0);
                },

                formatUSD(val) {
                    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val || 0);
                },

                get filteredProducts() {
                    return this.products.filter(p => {
                        let matchCat = this.posCategory === '' || p.kategori === this.posCategory;
                        let matchSearch = p.nama.toLowerCase().includes(this.posSearch.toLowerCase());
                        return matchCat && matchSearch;
                    });
                },

                addToCart(prod) {
                    let existing = this.cart.find(item => item.id === prod.id);
                    if(existing) {
                        existing.qty++;
                    } else {
                        this.cart.push({ ...prod, qty: 1 });
                    }
                },

                updateQty(index, change) {
                    this.cart[index].qty += change;
                    if(this.cart[index].qty <= 0) {
                        this.cart.splice(index, 1);
                    }
                },

                get cartSubtotal() {
                    return this.cart.reduce((sum, item) => {
                        let price = this.posCurrency === 'IDR' ? item.hargaIDR : item.hargaUSD;
                        return sum + (price * item.qty);
                    }, 0);
                },

                get cartDiscountAmount() {
                    if(!this.selectedDiscountId) return 0;
                    let disc = this.discounts.find(d => d.id == this.selectedDiscountId);
                    if(!disc) return 0;
                    if(disc.tipe === 'persen') {
                        return (this.cartSubtotal * disc.nilai) / 100;
                    }
                    return disc.nilai;
                },

                get cartFinalTotal() {
                    return Math.max(0, this.cartSubtotal - this.cartDiscountAmount);
                },

                processCheckout() {
                    alert('Transaksi berhasil diproses!');
                    this.cart = [];
                },

                loadDashboardData() {
                    // Refresh data dashboard
                },

                exportToPDF() {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    doc.text("Laporan Transaksi GLYCERA", 14, 20);
                    doc.save("laporan-glycera.pdf");
                }
            }
        }
    </script>
</body>
